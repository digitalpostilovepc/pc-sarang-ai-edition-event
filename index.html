<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PC사랑 AI Edition 론칭 기념 AI 실무 마스터 클래스 이벤트"
    />
    <meta name="theme-color" content="#06162d" />
    <title>PC사랑 AI Edition 이벤트</title>
    <link rel="stylesheet" href="./modern-normalize.css" />
    <style>
      :root {
        color-scheme: dark;
        --page-background: #06162d;
        --cta-start: #42e8ff;
        --cta-end: #1d7bff;
        --cta-shadow: rgba(29, 123, 255, 0.42);
      }

      html,
      body {
        min-height: 100%;
        background: var(--page-background);
      }

      body {
        overflow: hidden;
      }

      .landing-page {
        position: relative;
        isolation: isolate;
        min-height: 100svh;
        overflow: hidden;
        background: var(--page-background);
      }

      .hero-surface,
      .hero-surface::after,
      .hero-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .hero-surface {
        z-index: -1;
        display: grid;
        place-items: center;
        background: var(--page-background);
      }

      .hero-surface picture {
        position: absolute;
        inset: 0;
      }

      .hero-image {
        position: absolute;
        display: block;
        object-fit: cover;
        object-position: right center;
      }

      .hero-surface::after {
        content: "";
        background:
          linear-gradient(180deg, rgba(3, 13, 30, 0.08) 0%, rgba(3, 13, 30, 0.08) 70%, rgba(3, 13, 30, 0.3) 100%),
          linear-gradient(90deg, rgba(3, 13, 30, 0.12), transparent 42%, rgba(3, 13, 30, 0.08));
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-height: 100svh;
        padding: clamp(1rem, 4vw, 4rem);
      }

      .event-message {
        width: min(38rem, 43vw);
        margin-left: clamp(0rem, 3vw, 3rem);
        color: #fff;
        text-align: left;
        text-wrap: balance;
        word-break: keep-all;
        overflow-wrap: normal;
      }

      .title-unit,
      .copy-unit {
        display: inline-block;
        white-space: nowrap;
      }

      .event-title {
        max-width: 18ch;
        margin: 0;
        color: #fff;
        font-size: clamp(2rem, 4vw, 4.25rem);
        font-weight: 900;
        letter-spacing: -0.065em;
        line-height: 1.14;
        word-break: keep-all;
      }

      .event-lead {
        margin: 1.25rem 0 0;
        color: rgba(255, 255, 255, 0.94);
        font-size: clamp(1rem, 1.5vw, 1.35rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.6;
        word-break: keep-all;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: min(19rem, 100%);
        min-height: 3.5rem;
        margin-top: 1.25rem;
        padding: 0.9rem 1.75rem;
        border: 1px solid rgba(255, 255, 255, 0.38);
        border-radius: 999px;
        background: linear-gradient(135deg, var(--cta-start), var(--cta-end));
        box-shadow: 0 1rem 2.5rem var(--cta-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.46);
        color: #03152c;
        font-size: clamp(1rem, 1.2vw, 1.1rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 1.3rem 3rem var(--cta-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        filter: brightness(1.06);
      }

      .cta:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 5px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 640px) {
        .hero-image {
          object-fit: cover;
          object-position: center bottom;
        }

        .content {
          align-items: flex-start;
          justify-content: center;
          padding: 1rem;
          padding-top: max(1.25rem, env(safe-area-inset-top));
        }

        .event-message {
          width: min(100%, 30rem);
          margin: 0;
          padding: 0.35rem 0.5rem 0;
          border: 0;
          border-radius: 0;
          background: transparent;
          box-shadow: none;
          text-align: center;
          backdrop-filter: none;
          text-shadow: 0 2px 1rem rgba(0, 0, 0, 0.72);
        }

        .event-title {
          max-width: none;
          font-size: clamp(1.46rem, 7vw, 2rem);
          line-height: 1.5;
        }

        .event-title .title-unit {
          display: block;
        }

        .event-lead {
          margin-top: 0.85rem;
          font-size: 0.9rem;
          line-height: 1.55;
        }

        .cta {
          width: min(100%, 21rem);
          min-height: 2.85rem;
          margin-top: 1.25rem;
          margin-bottom: 0;
          padding: 0.7rem 1.1rem;
          font-size: 0.92rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="landing-page" aria-labelledby="page-title">
      <div class="hero-surface" aria-hidden="true">
        <picture>
          <source
            media="(max-width: 640px)"
            srcset="./hero-ai-edition-pcsarang-october-mobile-top-copy.png"
          />
          <img
            class="hero-image"
            src="./hero-ai-edition-pcsarang-october-desktop-left-copy.png"
            alt="PC사랑 AI Edition AI 실무 마스터 클래스 이벤트"
          />
        </picture>
      </div>

      <div class="content">
        <section class="event-message" aria-labelledby="page-title">
          <h1 id="page-title" class="event-title">
            <span class="title-unit">PC사랑 AI Edition</span>
            <span class="title-unit">론칭 기념</span>
            <span class="title-unit">특별 이벤트</span>
          </h1>
          <p class="event-lead">
            <span class="copy-unit">30만원 상당</span>
            <span class="copy-unit">AI 실전 강의</span>
            <span class="copy-unit">무료로 만나보세요.</span>
          </p>
          <a
            class="cta"
            href="https://www.ilovepc.co.kr/event/event4.html"
            aria-label="PC사랑 AI Edition 무료 강의 이벤트 혜택 확인"
          >
            무료 강의 혜택 확인하기
          </a>
        </section>
      </div>
    </main>
  </body>
</html>
